components:
  schemas:
    ApiEnvelope:
      type: object
      required: [code, message, data, timestamp]
      properties:
        code:
          type: integer
          description: 0=成功；1001/1002/2001/2002/2003/3002/4001/4002/4004/5001/5002/5003 见错误码表
        message:
          type: string
          description: 提示文案，直接展示给用户
        data:
          type: object
          nullable: true
        timestamp:
          type: integer
          format: int64
          description: 服务端时间戳（毫秒）
    Pagination:
      type: object
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
