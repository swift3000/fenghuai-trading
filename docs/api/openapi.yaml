openapi: 3.0.3
info:
  title: 钱多多采购下单助手 — 云函数接口（OpenAPI 规格）
  version: 1.2.0
  description: |
    本规格基于云函数源码（case 块 + 权限映射）逐条对账生成（68 个 action，10 个云函数，2026-08-30 T55-SC-8 全量重生成），
    作为机器可读的接口契约。云函数调用方式：wx.cloud.callFunction({ name: 云函数名, data: { action, ... } })。
    所有接口统一返回 {code, message, data, timestamp}；错误码表见 API_接口文档.md §1.4。
    维护纪律：新增/变更云函数 action 时必须同步更新本文件（APID 门禁）。
    注意：path 仅为 OpenAPI 表达形式（云函数无 HTTP 路由），实际以 name+action 为准。
servers:
  - url: https://cloud1-d6g75loi673b1e039.tcloudbase.com
    description: 微信云开发 CloudBase 环境（云函数调用入口，非 HTTP REST）
tags:
    - name: auth
      description: 云函数 auth 的 action 集合
    - name: products
      description: 云函数 products 的 action 集合
    - name: customers
      description: 云函数 customers 的 action 集合
    - name: regions
      description: 云函数 regions 的 action 集合
    - name: orders
      description: 云函数 orders 的 action 集合
    - name: receivable
      description: 云函数 receivable 的 action 集合
    - name: users
      description: 云函数 users 的 action 集合
    - name: smart
      description: 云函数 smart 的 action 集合
    - name: system
      description: 云函数 system 的 action 集合
    - name: report
      description: 云函数 report 的 action 集合
    - name: outbound
      description: 云函数 outbound 的 action 集合
    - name: import-data
      description: 云函数 import-data 的 action 集合（管理员运维）
    - name: sync-data
      description: 云函数 sync-data 的 action 集合（管理员运维）
paths:
  '/auth/login':
    post:
      summary: "用户登录（openid 自动绑定/邀请码激活）"
      description: "云函数 auth / login 的 action 接口。调用: wx.cloud.callFunction({ name: 'auth', data: { action: 'login' } })。权限: 公开（未登录入口）。"
      tags: ["auth"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "action: \"login\"（必填）；role: string（选填，默认 orderer）; name?: string; phone?: string; region?: string; inviteCode?: string（邀请制绑定时携带）"
      responses:
        '200':
          description: 统一包装 {code, message, data, timestamp}；code=0 成功，其余见 docs/api/API_接口文档.md §1.4
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        description: "user(对象), isNewUser: boolean"
  '/auth/getInviteCode':
    post:
      summary: "生成邀请码（仅管理员）"
      description: "云函数 auth / getInviteCode 的 action 接口。调用: wx.cloud.callFunction({ name: 'auth', data: { action: 'getInviteCode' } })。权限: admin（handler 内 role 校验）。"
      tags: ["auth"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "action: \"getInviteCode\"（必填）；role: orderer|sorter|warehouse|admin（选填，默认 orderer）; name?: string; phone?: string; region?: string"
      responses:
        '200':
          description: 统一包装 {code, message, data, timestamp}；code=0 成功，其余见 docs/api/API_接口文档.md §1.4
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        description: "inviteCode(6位), inviteQr(小程序码fileID或null), _id"
  '/auth/activateByInvite':
    post:
      summary: "通过邀请码激活绑定"
      description: "云函数 auth / activateByInvite 的 action 接口。调用: wx.cloud.callFunction({ name: 'auth', data: { action: 'activateByInvite' } })。权限: 登录即可（openid 上下文）。"
      tags: ["auth"]
      requestBody:
