                    properties:
                      data:
                        type: object
                        description: "商品对象（无 list 包裹）"
  '/products/create':
    post:
      summary: "新增商品"
      description: "云函数 products / create 的 action 接口。调用: wx.cloud.callFunction({ name: \"products\", data: { action: \"create\", ... } })。权限: orderer/sorter/warehouse/admin。"
      tags: ["products"]
      requestBody:
