      description: "云函数 auth / checkAuth 的 action 接口。调用: wx.cloud.callFunction({ name: 'auth', data: { action: 'checkAuth' } })。权限: 登录即可（返回权限信息不拦截）。"
      tags: ["auth"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "action: \"checkAuth\"（必填）；requiredPermission: string（必填，权限键如 order:create）"
      responses:
