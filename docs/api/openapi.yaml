openapi: 3.0.3
info:
  title: 乾多多采购下单助手 — 云函数接口（OpenAPI 规格）
  version: 1.0.0
  description: |
    本规格基于 docs/api/API_接口文档.md 整理（31 个 action，10 个云函数），
    作为机器可读的接口契约。云函数调用方式：wx.cloud.callFunction({ name: '<云函数>', data: { action, payload/... } })。
    所有接口统一返回 {code, message, data, timestamp}；错误码表见 API_接口文档.md §1.4。
    维护纪律：新增/变更云函数 action 时必须同步更新本文件（APID 门禁）。
    注意：path 仅为 OpenAPI 表达形式（云函数无 HTTP 路由），实际以 name+action 为准。
servers:
  - url: https://cloud1-d6g75loi673b1e039.tcloudbase.com
    description: 微信云开发 CloudBase 环境（云函数调用入口，非 HTTP REST）
tags:
    - name: auth
      description: 云函数 auth 的 action 集合
    - name: products
      description: 云函数 products 的 action 集合
    - name: customers
      description: 云函数 customers 的 action 集合
    - name: regions
      description: 云函数 regions 的 action 集合
    - name: orders
      description: 云函数 orders 的 action 集合
    - name: receivable
      description: 云函数 receivable 的 action 集合
    - name: users
      description: 云函数 users 的 action 集合
    - name: smart
      description: 云函数 smart 的 action 集合
    - name: system
      description: 云函数 system 的 action 集合
    - name: report
      description: 云函数 report 的 action 集合
paths:
  '/auth/login':
    post:
      summary: "用户登录（openid 自动绑定/邀请码激活）"
      description: "云函数 auth 的 action 接口。调用: wx.cloud.callFunction({ name: \"auth\", data: { ... } })。权限: 公开。"
      tags: ["auth"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "inviteCode: string（邀请制绑定时携带）；小程序端其余字段不传"
      responses:
        '200':
          description: 统一包装 {code, message, data, timestamp}；code=0 成功，其余见 docs/api/API_接口文档.md §1.4
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        description: "user(对象或null), token(后台用), need_bind: boolean"
  '/auth/invite-code':
    post:
      summary: "生成邀请码（管理员）"
      description: "云函数 auth / getInviteCode 的 action 接口。调用: wx.cloud.callFunction({ name: \"auth\", data: { action: \"getInviteCode\", ... } })。权限: admin。"
      tags: ["auth"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "role: orderer|sorter|warehouse|admin（必填）; name/phone/region: string（选填）"
      responses:
        '200':
          description: 统一包装 {code, message, data, timestamp}；code=0 成功，其余见 docs/api/API_接口文档.md §1.4
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        description: "userId, inviteCode(6位), expireTime, role, qrFileID"
  '/products':
    post:
      summary: "商品列表"
      description: "云函数 products / products 的 action 接口。调用: wx.cloud.callFunction({ name: \"products\", data: { action: \"products\", ... } })。权限: orderer/sorter/warehouse/admin。"
      tags: ["products"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "customer_id?: string（客户常购优先排序）; filter?: {keyword, category, status}; page?: number; page_size?: number; sort?: object（usage: -1 常用）"
      responses:
        '200':
          description: 统一包装 {code, message, data, timestamp}；code=0 成功，其余见 docs/api/API_接口文档.md §1.4
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        description: "list[]（商品对象）+ pagination"
  '/products/detail':
    post:
      summary: "商品详情"
      description: "云函数 products / product-detail 的 action 接口。调用: wx.cloud.callFunction({ name: \"products\", data: { action: \"product-detail\", ... } })。权限: orderer/sorter/warehouse/admin。"
