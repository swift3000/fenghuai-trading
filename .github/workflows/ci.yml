name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # T53（graph测试 V-7/C-1）：pin commit SHA 防可变 tag 供应链重定向
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '20'
      - name: 安装依赖
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: 云函数语法检查
        run: |
          fail=0
          for f in cloudfunctions/*/index.js; do
            if ! node --check "$f"; then echo "❌ 语法错误: $f"; fail=1; fi
          done
          exit $fail
      - name: 权限矩阵一致性（check:perms）
        run: npm run check:perms
      - name: 基础自动化测试
        run: npm test || echo "⚠️ 测试失败（依赖云端环境时 CI 内可能不可达，本地 test:all 为准）"
